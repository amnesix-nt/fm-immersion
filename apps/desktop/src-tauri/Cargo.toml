[package]
name = "fm-immersion"
version = "0.1.197"
description = "FM Immersion — le compagnon de tes parties de Football Manager 27"
authors = ["FM Immersion"]
license = "MIT"
repository = "https://github.com/amnesix-nt/fm-immersion"
edition = "2021"
rust-version = "1.80"

[lib]
name = "fm_immersion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
# Plugin FM27 : téléchargement depuis GitHub Releases (sur demande) et vérification SHA-256
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
# Visages : extraction du pack V2 téléchargé (zip de la release GitHub)
zip = { version = "2", default-features = false, features = ["deflate"] }
# Rédaction par IA : clé API du joueur rangée dans le coffre de Windows (Gestionnaire d'identification)
keyring = { version = "3", features = ["windows-native"] }
# Photos de situation : extraction de l'archive 7z de ComfyUI portable (LZMA2 + filtre BCJ, sans chiffrement)
sevenz-rust2 = { version = "0.25", default-features = false }

# FM27 : lecture directe de la base du jeu en mémoire (lecture seule, à la demande du joueur)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
